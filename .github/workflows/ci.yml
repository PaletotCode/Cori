name: cori-v2-ci

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "codex/**"

jobs:
  backend-quality:
    name: Backend - lint typecheck test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: cori
          POSTGRES_PASSWORD: cori
          POSTGRES_DB: cori
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cori -d cori"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://cori:cori@localhost:5432/cori
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Ruff lint
        run: ruff check backend/app backend/tests

      - name: Mypy typecheck
        run: mypy backend/app

      - name: Pytest
        run: pytest backend/tests -q

  frontend-quality:
    name: Front-end - lint typecheck test build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install front-end dependencies
        run: npm ci --prefix front-end

      - name: Lint
        run: npm --prefix front-end run lint

      - name: Typecheck
        run: npm --prefix front-end run typecheck

      - name: Test
        run: npm --prefix front-end run test -- --runInBand

      - name: Build web bundle
        run: npm --prefix front-end run build

  docker-build:
    name: Docker build - api worker
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API and Worker images
        run: docker compose -f infra/docker-compose.yml build api worker
